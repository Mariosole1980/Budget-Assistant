<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="walletGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff7a6e"/>
      <stop offset="1" stop-color="#e05e55"/>
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#2ec4b6"/>
      <stop offset="1" stop-color="#4ade80"/>
    </linearGradient>
  </defs>

  <!-- Wallet body -->
  <rect x="120" y="176" width="272" height="176" rx="40" fill="url(#walletGrad)"/>
  <!-- Wallet flap -->
  <path d="M120,216 Q256,150 392,216 L392,224 Q256,158 120,224 Z" fill="#ffffff" fill-opacity="0.18"/>
  <!-- Wallet clasp -->
  <rect x="236" y="196" width="40" height="14" rx="7" fill="#ffffff" fill-opacity="0.85"/>

  <!-- Coin -->
  <circle cx="256" cy="264" r="52" fill="#ffffff"/>
  <circle cx="256" cy="264" r="52" fill="none" stroke="#e05e55" stroke-opacity="0.25" stroke-width="6"/>
  <text x="256" y="282" font-family="Arial, Helvetica, sans-serif" font-size="56" font-weight="800" fill="#e05e55" text-anchor="middle" dominant-baseline="middle">€</text>

  <!-- Rising growth arrow -->
  <polyline points="150,352 214,300 258,330 362,240" fill="none" stroke="url(#arrowGrad)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="362,240 330,236 344,268" fill="url(#arrowGrad)"/>
</svg>
