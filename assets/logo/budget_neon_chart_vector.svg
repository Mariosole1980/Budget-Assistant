<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <!-- Bar 1 Gradient (Purple) -->
    <linearGradient id="bar1Grad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Bar 2 Gradient (Indigo/Blue) -->
    <linearGradient id="bar2Grad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <!-- Bar 3 Gradient (Blue/Teal) -->
    <linearGradient id="bar3Grad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Bar 4 Gradient (Teal/Cyan) -->
    <linearGradient id="bar4Grad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>

    <!-- Bar 5 Gradient (Emerald/Green) -->
    <linearGradient id="bar5Grad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#4ade80"/>
    </linearGradient>

    <!-- Arrow Trend Line Gradient -->
    <linearGradient id="arrowGrad" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="35%" stop-color="#3b82f6"/>
      <stop offset="70%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur1"/>
      <feGaussianBlur stdDeviation="14" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g transform="translate(16, 20)">
    <!-- 5 Vertical Neon Bars (Outlined & Glowing) -->
    <!-- Bar 1: X=60, Y=280, W=42, H=120 -->
    <rect x="60" y="270" width="42" height="130" rx="10" fill="none" stroke="url(#bar1Grad)" stroke-width="12" filter="url(#softGlow)"/>
    
    <!-- Bar 2: X=130, Y=220, W=42, H=180 -->
    <rect x="130" y="210" width="42" height="190" rx="10" fill="none" stroke="url(#bar2Grad)" stroke-width="12" filter="url(#softGlow)"/>
    
    <!-- Bar 3: X=200, Y=170, W=42, H=230 -->
    <rect x="200" y="155" width="42" height="245" rx="10" fill="none" stroke="url(#bar3Grad)" stroke-width="12" filter="url(#softGlow)"/>
    
    <!-- Bar 4: X=270, Y=120, W=42, H=280 -->
    <rect x="270" y="105" width="42" height="295" rx="10" fill="none" stroke="url(#bar4Grad)" stroke-width="12" filter="url(#softGlow)"/>
    
    <!-- Bar 5: X=340, Y=70, W=42, H=330 -->
    <rect x="340" y="65" width="42" height="335" rx="10" fill="none" stroke="url(#bar5Grad)" stroke-width="12" filter="url(#softGlow)"/>

    <!-- Upward Trend Line & Arrow -->
    <!-- Glow Path behind line -->
    <polyline points="45,360 115,260 185,300 255,190 395,65" 
              fill="none" stroke="url(#arrowGrad)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" opacity="0.4" filter="url(#neonGlow)"/>
              
    <!-- Sharp Core Line -->
    <polyline points="45,360 115,260 185,300 255,190 395,65" 
              fill="none" stroke="url(#arrowGrad)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
              
    <!-- Arrow Head -->
    <polygon points="395,65 345,62 372,115" fill="url(#arrowGrad)" filter="url(#softGlow)"/>
  </g>
</svg>
