apply plugin: 'com.android.application'

// Play Store release build (v1408): full native APK/AAB + OTA bundle.
// Read signing credentials from local.properties (never commit these to git)
def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) {
    localProps.load(new FileInputStream(localPropsFile))
}

android {
    namespace "com.budgetassistant.app"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.budgetassistant.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1644
        versionName "1.0.1644"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
        }
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~:*.zip:playstore'
        }
    }
    signingConfigs {
        release {
            storeFile file(localProps.getProperty('KEYSTORE_PATH', '../release.keystore'))
            storePassword localProps.getProperty('KEYSTORE_PASSWORD', '')
            keyAlias localProps.getProperty('KEY_ALIAS', '')
            keyPassword localProps.getProperty('KEY_PASSWORD', '')
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            // R8 minification DISABLED: enabling it (v1596) caused an immediate
            // startup crash because R8 strips/renames reflection-accessed classes
            // (WorkManager Worker, BroadcastReceivers, @JavascriptInterface
            // anonymous classes, Capacitor plugins). The app relies heavily on
            // reflection, so minification is unsafe here. Minification is an
            // optimization, NOT a Play Store requirement.
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.biometric:biometric:1.1.0"
    implementation "androidx.work:work-runtime:2.9.0"
    implementation "com.google.guava:guava:31.1-android"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
    implementation 'com.android.billingclient:billing:8.0.0'
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
