<!DOCTYPE html>
<html lang="el" style="height:100%; margin:0; background-color:#0F1219;">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Budget Assistant — Splash</title>
<style>
  /* Local webfonts (offline-safe replacement for the Google Fonts CDN import) */
  @font-face {
    font-family: 'Poppins';
    font-style: normal;
    font-weight: 700;
    src: url('js/webfonts/poppins-bold.woff2') format('woff2');
  }
  @font-face {
    font-family: 'Inter';
    font-style: normal;
    font-weight: 500;
    src: url('js/webfonts/inter-medium.woff2') format('woff2');
  }

  :root{
    --bg-1: #232A3B;
    --bg-2: #171B26;
    --bg-3: #0F1219;
    --text: #F2F4F8;
    --text-dim: #8A93A6;
    --cyan: #45E0D6;
    --blue: #4FA8F5;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  html,body{
    width:100vw;
    height:100vh;
    min-height:100dvh;
    overflow:hidden;
    background:var(--bg-3);
    font-family:"Inter", sans-serif;
  }

  /* Fullscreen stage (the v5 mockup's .phone, expanded to the real device screen) */
  .phone{
    position:relative;
    width:100%;
    height:100%;
    background:
      radial-gradient(130% 85% at 50% 8%, var(--bg-1) 0%, var(--bg-2) 48%, var(--bg-3) 100%);
    overflow:hidden;
  }

  /* two-tone glow echoing the icon's own gradient: violet low-left, green high-right */
  .glow{
    position:absolute;
    inset:0;
    opacity:0;
    animation:glowIn 1.6s ease 0.05s forwards;
  }
  .glow::before, .glow::after{
    content:"";
    position:absolute;
    width:300px; height:300px;
    border-radius:50%;
    filter:blur(50px);
  }
  .glow::before{
    background:rgba(139,92,246,0.20);
    top:40%; left:28%;
    transform:translate(-50%,-50%);
  }
  .glow::after{
    background:rgba(70,214,127,0.20);
    top:26%; left:62%;
    transform:translate(-50%,-50%);
  }
  @keyframes glowIn{ to{ opacity:1; } }

  .content{
    position:relative;
    height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:0 32px;
  }

  .mark{
    position:relative;
    width:184px;
    height:auto;
    margin-bottom:28px;
    opacity:0;
    transform:scale(0.78) translateY(14px);
    animation:markIn 0.9s cubic-bezier(.22,1,.36,1) 0.15s forwards;
  }
  .mark img{
    display:block;
    width:100%;
    height:auto;
    filter:
      drop-shadow(0 0 18px rgba(70,214,127,0.30))
      drop-shadow(0 0 30px rgba(139,92,246,0.22))
      drop-shadow(0 14px 24px rgba(0,0,0,0.35));
  }
  @keyframes markIn{ to{ opacity:1; transform:scale(1) translateY(0); } }

  .wordmark{
    font-family:"Poppins", sans-serif;
    font-weight:700;
    font-size:29px;
    color:var(--text);
    letter-spacing:-0.01em;
    opacity:0;
    transform:translateY(10px);
    animation:rise 0.6s ease 1.15s forwards;
    text-align:center;
  }

  .tagline{
    margin-top:9px;
    font-family:"Inter", sans-serif;
    font-weight:500;
    font-size:12.5px;
    letter-spacing:0.16em;
    text-transform:uppercase;
    color:var(--text-dim);
    opacity:0;
    transform:translateY(8px);
    animation:rise 0.6s ease 1.35s forwards;
  }

  @keyframes rise{ to{ opacity:1; transform:translateY(0); } }

  .loader{
    position:absolute;
    bottom:64px;
    left:50%;
    transform:translateX(-50%);
    width:56px;
    height:4px;
    border-radius:4px;
    background:rgba(255,255,255,0.08);
    overflow:hidden;
    opacity:0;
    animation:fadeIn 0.5s ease 1.6s forwards;
  }
  @keyframes fadeIn{ to{ opacity:1; } }
  .loader::after{
    content:"";
    position:absolute;
    top:0; left:-40%;
    width:40%; height:100%;
    border-radius:4px;
    background:linear-gradient(90deg, var(--cyan), var(--blue));
    animation:sweep 1.1s ease-in-out infinite 1.9s;
  }
  @keyframes sweep{
    0%{ left:-40%; }
    100%{ left:100%; }
  }

  @media (prefers-reduced-motion: reduce){
    .glow,.mark,.wordmark,.tagline,.loader,.loader::after{
      animation-duration:0.01ms !important;
      animation-delay:0s !important;
    }
  }
</style>
</head>
