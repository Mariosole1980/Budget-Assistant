<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ενημέρωση Budget Assistant...</title>
  <style>
    body {
      background: #0d1117;
      color: #e6edf3;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      flex-direction: column;
      gap: 20px;
      text-align: center;
      padding: 24px;
    }
    .spinner {
      font-size: 50px;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { 100% { transform: rotate(360deg); } }
    .status {
      font-size: 14px;
      color: #3fb950;
      font-family: monospace;
      background: #161b22;
      padding: 12px 20px;
      border-radius: 8px;
      border: 1px solid #30363d;
      min-width: 280px;
    }
  </style>
</head>
<body>
  <div class="spinner">🔄</div>
  <h2>Γίνεται αναγκαστική ενημέρωση...</h2>
  <p>Διαγραφή παλιών εκδόσεων από τη συσκευή σας.</p>
  <div class="status" id="status">⏳ Παρακαλώ περιμένετε...</div>

  <script>
    const status = document.getElementById('status');
    
    function log(msg) {
      status.textContent = msg;
      console.log(msg);
    }

    async function nuke() {
      // 1. Unregister all service workers
      if ('serviceWorker' in navigator) {
        try {
          log('🗑️ Διαγραφή Service Workers...');
          const regs = await navigator.serviceWorker.getRegistrations();
          for (let i = 0; i < regs.length; i++) {
            await regs[i].unregister();
          }
          log('✅ ' + regs.length + ' Service Worker(s) αφαιρέθηκαν');
        } catch (e) {
          log('⚠️ Σφάλμα SW: ' + e.message);
        }
      }

      await new Promise(r => setTimeout(r, 400));

      // 2. Delete all caches
      if ('caches' in window) {
        try {
          log('🗑️ Καθαρισμός Cache Storage...');
          const keys = await caches.keys();
          for (let i = 0; i < keys.length; i++) {
            await caches.delete(keys[i]);
          }
          log('✅ ' + keys.length + ' cache(s) διαγράφηκαν');
        } catch (e) {
          log('⚠️ Σφάλμα Cache: ' + e.message);
        }
      }

      await new Promise(r => setTimeout(r, 400));

      // 3. Clear localStorage update & sync queue keys
      try {
        log('🗑️ Καθαρισμός localStorage & Ουράς Συγχρονισμού...');
        localStorage.removeItem('_ba_last_update_check');
        localStorage.removeItem('_ba_last_reload_build');
        localStorage.removeItem('ota_active_build');
        localStorage.removeItem('ota_previous_build');
        localStorage.removeItem('ota_build_timestamp');
        localStorage.removeItem('money_manager_sync_queue');
        localStorage.removeItem('bg_active_modal_id');
        localStorage.removeItem('bg_active_modal_tx_id');
        localStorage.removeItem('bg_active_subcat_txs');
        localStorage.removeItem('bg_active_subscreen_id');
        log('✅ localStorage καθαρίστηκε');
      } catch (e) {}

      await new Promise(r => setTimeout(r, 800));

      log('🚀 Ολοκληρώθηκε! Ανακατεύθυνση...');
      
      await new Promise(r => setTimeout(r, 800));
      
      // Redirect to fresh app using cache-busted URL
      window.location.replace('/?_force=' + Date.now());
    }

    nuke().catch(err => {
      log('❌ Σφάλμα: ' + err.message);
    });
  </script>
</body>
</html>
