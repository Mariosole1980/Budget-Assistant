          <!-- SUBSCREEN: Preferences -->
          <div id="subscreen-preferences" class="subscreen-section" style="display:none;">
            <div class="settings-list-item" id="preferences-lang-row" style="cursor: pointer;">
              <span class="settings-item-label" data-i18n="item_language">Γλώσσα</span>
              <span class="settings-item-value" id="lang-setting-val">Ελληνικά</span>
            </div>
            <div class="settings-list-item">
              <span class="settings-item-label" data-i18n="item_theme">Θέμα Εμφάνισης</span>
              <select id="settings-theme" class="settings-select" onchange="changeThemeSetting(this.value)">
                <option value="dark">Premium Dark</option>
                <option value="oled">OLED Black</option>
                <option value="light">Classic Light</option>
                <option value="emerald">Emerald Forest</option>
                <option value="ocean">Ocean Breeze</option>
                <option value="pink">Blossom Pink</option>
              </select>
            </div>
            <div class="settings-list-item">
              <span class="settings-item-label" data-i18n="item_currency">Κύριο Νόμισμα</span>
              <select id="settings-currency" class="settings-select" onchange="changeCurrencySetting(this.value)">
                <option value="EUR">EUR (€)</option>
                <option value="USD">USD ($)</option>
                <option value="GBP">GBP (£)</option>
                <option value="JPY">JPY (¥)</option>
              </select>
            </div>
            <div class="settings-list-item">
              <span class="settings-item-label" data-i18n="item_month_start">Έναρξη Μήνα</span>
              <select id="settings-month-start" class="settings-select" onchange="changeMonthStartSetting(this.value)">
                <option value="1">1</option><option value="2">2</option><option value="3">3</option>
                <option value="4">4</option><option value="5">5</option><option value="6">6</option>
                <option value="7">7</option><option value="8">8</option><option value="9">9</option>
                <option value="10">10</option><option value="11">11</option><option value="12">12</option>
                <option value="13">13</option><option value="14">14</option><option value="15">15</option>
                <option value="16">16</option><option value="17">17</option><option value="18">18</option>
                <option value="19">19</option><option value="20">20</option><option value="21">21</option>
                <option value="22">22</option><option value="23">23</option><option value="24">24</option>
                <option value="25">25</option><option value="26">26</option><option value="27">27</option>
                <option value="28">28</option>
              </select>
            </div>
            <div class="settings-list-item">
              <span class="settings-item-label" data-i18n="item_week_start">Έναρξη Εβδομάδας</span>
              <select id="settings-week-start" class="settings-select" onchange="changeWeekStartSetting(this.value)">
                <option value="1" data-i18n="val_week_start">Δευτέρα</option>
                <option value="0" data-i18n="val_week_start_sun">Κυριακή</option>
                <option value="6" data-i18n="val_week_start_sat">Σάββατο</option>
              </select>
            </div>
            <div class="settings-list-item">
              <span class="settings-item-label" data-i18n="item_autocomplete">Έξυπνος Τίτλος (Autocomplete)</span>
              <label class="switch">
                <input type="checkbox" id="settings-autocomplete" onchange="toggleAutocompleteSetting(this.checked)">
                <span class="slider round"></span>
              </label>
            </div>
            <div class="settings-list-item">
              <span class="settings-item-label" data-i18n="item_note_shortcut">Κουμπί Σημειώσεων δίπλα στο "+"</span>
              <label class="switch">
                <input type="checkbox" id="settings-note-shortcut">
                <span class="slider round"></span>
              </label>
            </div>
          </div>
