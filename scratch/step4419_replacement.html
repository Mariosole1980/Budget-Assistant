          <div style="width: 36px; height: 36px; border-radius: 10px; background: linear-gradient(135deg, rgba(99,102,241,0.2), rgba(168,85,247,0.2)); display: flex; align-items: center; justify-content: center; border: 1px solid rgba(99,102,241,0.3);">

          </div>
          <div>

            <div style="font-size: 11px; color: var(--text-muted); display: flex; align-items: center; gap: 6px;">
              <span id="user-guide-version-badge" style="background: rgba(99,102,241,0.15); color: var(--primary); padding: 1px 6px; border-radius: 6px; font-weight: 600;">v889</span>

          </div>

        <div style="display: flex; align-items: center; gap: 8px;">
          <button id="user-guide-lang-btn" onclick="toggleUserGuideLanguage()" class="btn btn-secondary" style="padding: 5px 12px; font-size: 12px; border-radius: 8px; font-weight: 600; display: flex; align-items: center; gap: 5px; background: rgba(255,255,255,0.06); border: 1px solid var(--border);">
            <i class="fa-solid fa-globe"></i> <span id="user-guide-lang-label">EN</span>
          </button>
          <button onclick="closeModal('user-guide-modal')" style="background: rgba(255,255,255,0.06); border: 1px solid var(--border); color: var(--text-muted); width: 32px; height: 32px; border-radius: 8px; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center;">✕</button>
        </div>
      </div>

      <div style="padding: 10px 18px; background: var(--bg-card); border-bottom: 1px solid var(--border);">
